<!-- 1. Add this Game Card right next to your Drift Hunters Pro card -->
<div class="card" onclick="openRaccoonGame()" style="cursor: pointer;">
    <div style="background-color: #222; border-radius: 6px; padding: 15px; margin-bottom: 10px; border: 1px solid #333;">
        <span style="font-size: 24px;">🦝</span>
    </div>
    <h3>Raccoon Retail</h3>
    <p style="color: #a3e635; font-size: 12px;">● Embedded App Ready</p>
</div>

<!-- 2. Paste this Popup Frame at the very bottom of your file, right before the closing </body> tag -->
<div id="gameModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center;">
    <div style="background: #1e1e1e; border: 2px solid #a3e635; padding: 15px; border-radius: 12px; position: relative; width: 840px; text-align: center;">
        <button onclick="closeRaccoonGame()" style="position: absolute; top: -40px; right: 0; background: #a3e635; color: black; border: none; padding: 8px 15px; font-weight: bold; border-radius: 4px; cursor: pointer;">✕ Close Game</button>
        <h2 style="color: #a3e635; margin-top: 0; margin-bottom: 10px; font-family: sans-serif;">Raccoon Retail</h2>
        <iframe id="gameFrame" src="" width="800" height="600" frameborder="0" allowfullscreen></iframe>
    </div>
</div>

<script>
function openRaccoonGame() {
    document.getElementById('gameFrame').src = "https://itch.io";
    document.getElementById('gameModal').style.display = "flex";
}
function closeRaccoonGame() {
    document.getElementById('gameFrame').src = "";
    document.getElementById('gameModal').style.display = "none";
}
</script>
