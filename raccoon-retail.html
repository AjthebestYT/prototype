<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raccoon Retail - Learning V4</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0c0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header-bar {
            background-color: #111211;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1c1d1c;
        }
        .back-btn {
            background-color: #a3e635;
            color: #000000;
            text-decoration: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 6px;
            font-size: 14px;
        }
        .back-btn:hover {
            background-color: #bbf746;
        }
        .game-title {
            margin: 0;
            font-size: 18px;
            font-weight: bold;
        }
        .game-container {
            flex: 1;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="header-bar">
        <span class="game-title">🦝 Raccoon Retail</span>
        <a href="index.html" class="back-btn">← Back to Dashboard</a>
    </div>

    <!-- Fullscreen Game Embed -->
    <div class="game-container">
<!-- Update the iframe src inside raccoon-retail.html to a direct canvas mirror -->
<iframe src="https://gamedistribution.com" allowfullscreen></iframe>

    </div>

</body>
</html>
