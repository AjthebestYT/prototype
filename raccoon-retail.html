<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning V4 - Loading App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0b0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border-left-color: #a3e635;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-container {
            text-align: center;
        }
        h2 {
            font-size: 18px;
            color: #808280;
            margin: 0;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="status-container">
        <div class="loading-spinner"></div>
        <h2>Initializing unblocked application layer...</h2>
    </div>

    <!-- Tab Cloaking Engine Script -->
    <script>
        window.onload = function() {
            // 1. Spawns an anonymous, history-masked clean browser tab
            var maskedWindow = window.open("about:blank", "_blank");
            
            if (!maskedWindow) {
                alert("Pop-up blocked! Please allow pop-ups for this dashboard to run application cloaking.");
                // Redirect back safely if the pop-up fails
                window.location.replace("index.html");
                return;
            }

            // 2. Clear out margins and establish canvas properties on the blank layout document
            var doc = maskedWindow.document;
            doc.body.style.margin = "0";
            doc.body.style.padding = "0";
            doc.body.style.backgroundColor = "#000000";
            doc.body.style.overflow = "hidden";
            
            // Mask the favicon and tab title header inside the browser window
            doc.title = "Google Drive"; 
            
            var favicon = doc.createElement("link");
            favicon.rel = "icon";
            favicon.href = "https://gstatic.com";
            doc.head.appendChild(favicon);

            // 3. Dynamically instantiate the HTML5 distribution node container element
            var gameIframe = doc.createElement("iframe");
            gameIframe.style.width = "100vw";
            gameIframe.style.height = "100vh";
            gameIframe.style.border = "none";
            gameIframe.style.display = "block";
            gameIframe.setAttribute("allowfullscreen", "true");
            
            // Core game asset distribution mirror url
            gameIframe.src = "https://gamedistribution.com";

            // 4. Force push the game frame straight into the masked layout DOM
            doc.body.appendChild(gameIframe);

            // 5. Clean redirect your main hub page back to safety instantly in the background
            window.location.replace("index.html");
        };
    </script>

</body>
</html>
